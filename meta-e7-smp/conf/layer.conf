# Layer configuration for meta-e7-smp
#
# Yocto zeus (2019-10) — underscore override syntax, not colon.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "e7-smp"
BBFILE_PATTERN_e7-smp = "^${LAYERDIR}/"

# Higher than meta-alif-ensemble so these bbappends win any collision.
BBFILE_PRIORITY_e7-smp = "20"

LAYERDEPENDS_e7-smp = "core"
LAYERSERIES_COMPAT_e7-smp = "zeus"
